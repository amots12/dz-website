name: Build blog index

on:
  push:
    branches: [main]
    paths:
      - '_posts/**.json'
      - '!_posts/index.json'
      - 'scripts/build-index.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index.js
      - name: Commit index.json if changed
        run: |
          if git diff --quiet -- _posts/index.json; then
            echo "index.json already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/index.json
          git commit -m "chore: rebuild blog index"
          git push
